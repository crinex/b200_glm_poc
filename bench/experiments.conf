# =============================================================================
# 실험 목록 — 이 파일만 편집하면 됩니다.   실행: bash bench/run_experiments.sh
# 구성별 스크립트는 없습니다. 한 줄 = 실험 하나이고, 옵션 조합이 곧 "구성"입니다.
# 엔진은 bench/run_mtp1_ep_sweep.sh 하나가 모든 구성을 처리합니다.
#
# 형식:  <실험이름>  <KEY=VAL> <KEY=VAL> ...
#   실험이름 : 결과가 /workspace/results/<이름>_sweep/ 에 저장 (영문/숫자/밑줄)
#   빈 옵션  : 전부 기본값
#   위에서부터 순서대로 실행, 하나 실패해도 다음 진행
#
# ─────────────────────────────────────────────────────────────────────
# 옵션 키 (기본값)
# ─────────────────────────────────────────────────────────────────────
#   [병렬화]
#     TP=8            Tensor Parallel. 모델 가중치를 N장에 조각냄
#     DP=1            Data Parallel. non-expert(attention/dense)를 N벌 복제.
#                     TP*DP = 8 (GPU 수) 여야 함. DP>1 이면:
#                       · EP = TP*DP 로 자동 (전문가는 EP 로 분산)
#                       · --api-server-count 1 자동 (안 하면 기동 타임아웃)
#                       · 기동이 길다(10분+, torch.compile 직렬화)
#     NO_EP=1         Expert Parallel 끄기 (TP=8·DP=1 조합에서 주로 사용)
#   [MTP = speculative decoding]
#     NO_MTP=1        MTP 끄기 (기본은 켜짐)
#     SPEC_TOKENS=1   MTP draft 토큰 수. 1=저지연 유리, 2=고conc(≥128) 유리
#   [워크로드]
#     SWEEP=4,8,16,32,64,128,256   측정할 concurrency 목록
#     MAX_TOKENS=1024              OSL (바꾸면 기존 결과와 비교 불가)
#   [기타]
#     EXTRA_ARGS="..."   임의 vllm serve 인자 (따옴표 필수, 공백 구분 여러 개 OK)
#
# 고정(항상): Weight FP8 · KV cache fp8 · max-model-len 16384 · max-num-seqs 256
#            · gpu-util 0.93 · async-scheduling · ignore_eos · gen8k 1,024장
#
# ─────────────────────────────────────────────────────────────────────
# 구성별 세팅 예시 (그대로 복사해서 쓰면 됨)
# ─────────────────────────────────────────────────────────────────────
#   기준선 (MTP·EP 없음)          base      NO_MTP=1 NO_EP=1
#   TP8·EP1·MTP1 (저지연 기본)     ref       NO_EP=1 SPEC_TOKENS=1
#   TP8·EP1·MTP2                   mtp2      NO_EP=1 SPEC_TOKENS=2
#   TP8·EP8·MTP1 (EP 손해 확인됨)  ep8       SPEC_TOKENS=1
#   TP2·DP4·EP8·MTP1 (고처리량)    dp4       TP=2 DP=4 SPEC_TOKENS=1
#   + KV cache 증량               kvup      NO_EP=1 SPEC_TOKENS=1 EXTRA_ARGS="--gpu-memory-utilization 0.95"
#   + MoE 백엔드 교체(소문자!)     moedg     NO_EP=1 SPEC_TOKENS=1 EXTRA_ARGS="--moe-backend deep_gemm"
#   + prefix caching 끄기          noapc     NO_EP=1 SPEC_TOKENS=1 EXTRA_ARGS="--no-enable-prefix-caching"
#   + DBO(통신/계산 겹침)          dbo       NO_EP=1 SPEC_TOKENS=1 EXTRA_ARGS="--enable-dbo"
#   스크리닝(빠르게, 3점만)        아무거나  ... SWEEP=32,128,256
#
#   함정 주의:
#     · moe-backend 값은 소문자: deep_gemm / flashinfer_cutlass (로그의 대문자 아님)
#     · TP*DP 가 8 이 아니면 기동 실패
#     · 서버를 SIGKILL 하지 말 것 (NCCL 교착 → 재시작만 복구. FINDINGS §0)
#
# ─────────────────────────────────────────────────────────────────────
# 측정 완료 (2026-09-02, 서버 E) — 재현하려면 주석 해제
#   결론: 저지연 → TP8·EP1·MTP1 / 고처리량(conc≥128) → TP2·DP4·EP8·MTP1
# ─────────────────────────────────────────────────────────────────────
#p0_ref        NO_EP=1 SPEC_TOKENS=1                         # conc256=2,174
#p1_mtp2       NO_EP=1 SPEC_TOKENS=2 SWEEP=32,128,256        # conc128=2,338
#dp4tp2_ep8    TP=2 DP=4 SPEC_TOKENS=1                       # conc256=3,188 (세션 최고)

