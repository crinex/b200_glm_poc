# =============================================================================
# 실험 목록 — 이 파일의 값만 고치면 됩니다.  실행: bash bench/run_experiments.sh
#
# 형식 (한 줄 = 실험 하나):  <실험이름>  <옵션1> <옵션2> ...
#   실험이름 : 결과가 /workspace/results/<이름>_sweep 에 저장됨 (영문/숫자/밑줄)
#   옵션     : 비우면 전부 기본값
#
# ── 옵션 키 ──────────────────────────────────────────────────────────
#   병렬화:
#     TP=8            Tensor Parallel  (기본 8)
#     DP=1            Data Parallel    (기본 1). TP*DP 는 GPU 수(8)와 같아야 함
#                     DP>1 이면 EP=TP*DP 자동, API 서버 1개 강제 (기동 지연 방지)
#     NO_EP=1         Expert Parallel 끔 (기본: EP 켬. 단 TP=8·DP=1 에선 EP1=켬 무의미차)
#   MTP:
#     NO_MTP=1        MTP 끔 (기본: 켬)
#     SPEC_TOKENS=2   MTP draft 토큰 수 (기본 1)
#   워크로드:
#     SWEEP=32,128,256   측정할 concurrency (기본 4,8,16,32,64,128,256)
#     MAX_TOKENS=1024    OSL (기본 1024 = "8k1k" 조건, 변경 시 비교 불가)
#   기타:
#     EXTRA_ARGS="..."   임의 vllm serve 인자 (따옴표 필수)
#     API_SERVERS=1      API 서버 수 (DP>1 이면 자동 1)
#
# ── 고정 조건 (모든 실험 공통) ────────────────────────────────────────
#   Weight FP8 · KV cache fp8 · max-model-len 16384 · max-num-seqs 256
#   gpu-util 0.93 · async-scheduling · ignore_eos · gen8k 1,024장 (ISL≈8,200)
#
# ── 서버 E 측정 완료 (2026-09-02) — 재현하려면 주석 해제 ──────────────
# 결론(FINDINGS §6-4): 저지연/저부하 → TP8·EP1, 고처리량/고부하 → TP2·DP4·EP8
#p0_ref        NO_EP=1 SPEC_TOKENS=1
#p1_mtp2       NO_EP=1 SPEC_TOKENS=2 SWEEP=32,128,256
#dp4tp2_ep8    TP=2 DP=4 SPEC_TOKENS=1          # 세션 최고: conc256 3,188 tok/s (+47%)

# ── 다음 실험 (활성) ─────────────────────────────────────────────────
# 고부하 승자(TP2·DP4·EP8) 위에 추가 튜닝을 얹는다
dp4tp2_mtp2   TP=2 DP=4 SPEC_TOKENS=2          # 고부하 구성 + MTP2
dp4tp2_kvup   TP=2 DP=4 SPEC_TOKENS=1 EXTRA_ARGS="--gpu-memory-utilization 0.95"
#dp4tp2_c512  TP=2 DP=4 SPEC_TOKENS=1 SWEEP=128,256,512   # conc 확장 (포화 확인)

