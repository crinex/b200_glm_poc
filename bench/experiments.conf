# =============================================================================
# 실험 목록 — 이 파일의 값만 고치면 됩니다
#
# 형식 (한 줄 = 실험 하나):
#   <실험이름>  <옵션1> <옵션2> ...
#
#   실험이름  : 결과 폴더가 /workspace/results/<이름>_sweep 이 됩니다.
#               영문/숫자/밑줄만 사용.
#   옵션      : 비우면 전부 기본값. 사용 가능한 키 ↓
#
# ── 옵션 키 ──────────────────────────────────────────────────────────
#   NO_MTP=1                MTP 끔          (기본: MTP 켬)
#   SPEC_TOKENS=2           MTP draft 토큰 수 (기본 1)
#   NO_EP=1                 Expert Parallel 끔 (기본: EP8 켬)
#   SWEEP=4,8,16,32,64,128,256   측정할 concurrency 목록 (기본값 그대로 권장)
#   MAX_TOKENS=1024         OSL. "8k1k" 조건 = 1024 (변경 시 비교 불가 주의)
#   REQUESTS=1024           요청 수 상한 (레벨당 conc×4, 이 값이 캡)
#   EXTRA_ARGS="..."        임의 vllm serve 인자. 반드시 따옴표로 감쌀 것
#                           예: EXTRA_ARGS="--gpu-memory-utilization 0.96"
#
# ── 고정 조건 (모든 실험 공통, run_mtp1_ep_sweep.sh 가 강제) ─────────
#   Weight FP8 · KV cache fp8 · TP=8 · DP=1 · max-model-len 16384
#   max-num-seqs 256 · gpu-util 0.93 · async-scheduling · ignore_eos=1
#   gen8k 1,024장 (ISL ≈ 8,200)
#
# '#' 로 시작하는 줄과 빈 줄은 무시됩니다. 위에서부터 순서대로 실행됩니다.
# =============================================================================

